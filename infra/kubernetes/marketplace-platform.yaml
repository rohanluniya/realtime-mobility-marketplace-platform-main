apiVersion: v1
kind: Namespace
metadata:
  name: mobility-marketplace
  labels:
    app.kubernetes.io/part-of: realtime-mobility-marketplace-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: marketplace-config
  namespace: mobility-marketplace
data:
  MARKETPLACE_ENV: "production"
  MARKETPLACE_EXECUTION_PROFILE: "kubernetes_distributed"
  MARKETPLACE_TRANSPORT_MODE: "kafka"
  MARKETPLACE_SERVING_STORE: "valkey"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.mobility-marketplace.svc.cluster.local:9092"
  VALKEY_HOST: "valkey.mobility-marketplace.svc.cluster.local"
  VALKEY_PORT: "6379"
  ICEBERG_REST_URI: "http://lakekeeper.mobility-marketplace.svc.cluster.local:8181/catalog"
  MARKETPLACE_API_HOST: "0.0.0.0"
  MARKETPLACE_API_PORT: "8010"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: mobility-marketplace
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.2.0-alpine3.24
          args: ["valkey-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "volatile-ttl"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: mobility-marketplace
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace-api
  namespace: mobility-marketplace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marketplace-api
  template:
    metadata:
      labels:
        app: marketplace-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8010"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: marketplace-api
          image: realtime-mobility-marketplace-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8010
          envFrom:
            - configMapRef:
                name: marketplace-config
          env:
            - name: MARKETPLACE_API_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: marketplace-api-secrets
                  key: admin_token
                  optional: true
            - name: MARKETPLACE_API_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: marketplace-api-secrets
                  key: operator_token
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: marketplace-api
  namespace: mobility-marketplace
spec:
  type: ClusterIP
  selector:
    app: marketplace-api
  ports:
    - name: http
      port: 8010
      targetPort: 8010
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: marketplace-api-hpa
  namespace: mobility-marketplace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: marketplace-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-allow-marketplace-only
  namespace: mobility-marketplace
spec:
  podSelector:
    matchLabels:
      app: valkey
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: marketplace-api
      ports:
        - protocol: TCP
          port: 6379
